spring:
  application:
    name: comanda-digital-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/comanda_digital?serverTimezone=America/Asuncion&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:comanda_app}
    password: ${DB_PASSWORD:troque_esta_senha}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Asuncion
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      seedAdminStatus: ${SEED_ADMIN_STATUS:INATIVO}
  jackson:
    default-property-inclusion: non_null
  data:
    web:
      pageable:
        default-page-size: 12
        max-page-size: 100

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  forward-headers-strategy: framework

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration: PT8H
      issuer: comanda-digital-api
