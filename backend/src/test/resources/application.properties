# Integration tests verify the original demo seed in an isolated test database.
# Production uses the administrator safety guard by default.
app.security.seed-admin.enabled=false
# Only for isolated integration-test databases; never configure ATIVO in public deployments.
spring.flyway.placeholders.seedAdminStatus=ATIVO
# Dedicated disposable database. The test initializer rejects hosted/production URLs.
spring.datasource.url=jdbc:mysql://127.0.0.1:33316/dark_chicken_sprint1_test?sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=dark_chicken_test
spring.datasource.password=local-test-only
app.security.jwt.secret=isolated-tests-only-key-not-for-production-minimum-32-characters
