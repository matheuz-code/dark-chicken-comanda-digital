# Disposable local integration environment. No cloud services or production credentials.
services:
  mysql-test:
    image: mysql:8.4
    ports:
      - "127.0.0.1:33316:3306"
    environment:
      MYSQL_DATABASE: dark_chicken_sprint1_test
      MYSQL_USER: dark_chicken_test
      MYSQL_PASSWORD: local-test-only
      MYSQL_ROOT_PASSWORD: local-root-test-only
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
