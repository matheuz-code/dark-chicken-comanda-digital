name: Sprint 1 - Angular and isolated MySQL
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: sprint1-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  angular:
    # Standard runners are free for public repositories. Never run this in a private repo.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: angular_project
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build
  mysql-integration:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: dark_chicken_sprint1_test
          MYSQL_USER: dark_chicken_test
          MYSQL_PASSWORD: local-test-only
          MYSQL_ROOT_PASSWORD: local-root-test-only
        ports:
          - 33316:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -udark_chicken_test -plocal-test-only --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Unit and integration tests against disposable local MySQL
        working-directory: backend
        run: mvn -B --no-transfer-progress verify
