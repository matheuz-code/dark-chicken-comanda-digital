<main class="users-page"><header><button (click)="voltar()">←</button><div><p>Controle de acesso</p><h1>Usuários e perfis</h1></div><button class="outline" (click)="carregar()">Atualizar</button></header><p class="notice success" *ngIf="message">{{ message }}</p><p class="notice error" *ngIf="errorMessage">{{ errorMessage }}</p><p class="loading" *ngIf="loading">Carregando usuários…</p><section class="workspace" *ngIf="!loading"><form [formGroup]="form" (ngSubmit)="salvar()"><h2>{{ form.controls.id.value ? 'Editar usuário' : 'Novo usuário' }}</h2><label>Nome<input formControlName="nome" /></label><label>E-mail<input type="email" formControlName="email" /></label><label>{{ form.controls.id.value ? 'Nova senha (opcional)' : 'Senha' }}<input type="password" formControlName="senha" /></label><div class="fields"><label>Perfil<select formControlName="perfil"><option *ngFor="let perfil of perfis">{{ perfil }}</option></select></label><label>Status<select formControlName="status"><option>ATIVO</option><option>INATIVO</option></select></label></div><label>Telefone<input formControlName="telefone" /></label><label>Endereço<textarea formControlName="endereco"></textarea></label><div class="actions"><button type="submit" [disabled]="saving">Salvar</button><button type="button" class="outline" (click)="novo()">Limpar</button></div></form><div class="list"><h2>Contas cadastradas</h2><article *ngFor="let usuario of usuarios"><div><strong>{{ usuario.nome }}</strong><small>{{ usuario.email }} · {{ usuario.perfil }} · {{ usuario.status }}</small></div><div><button class="link" (click)="editar(usuario)">Editar</button><button class="danger" (click)="desativar(usuario.id)">Desativar</button></div></article></div></section></main>
