<main class="auth">
  <a class="back" routerLink="/" aria-label="Voltar">
    <span class="back__icon" aria-hidden="true">←</span>
    <span class="back__label">Voltar</span>
  </a>

  <section
    class="card"
    [class.is-signup]="mode() === 'signup'"
    aria-label="Autenticação"
  >
    <header class="brand">
      <span class="brand__icon" aria-hidden="true">🍴</span>
      <h1 class="brand__title">Dark Kitchen App</h1>
    </header>

    <nav class="tabs" aria-label="Modo">
      <button
        type="button"
        class="tabs__tab"
        [class.is-active]="mode() === 'login'"
        (click)="setMode('login')"
      >
        Entrar
      </button>
      <button
        type="button"
        class="tabs__tab"
        [class.is-active]="mode() === 'signup'"
        (click)="setMode('signup')"
      >
        Cadastrar
      </button>
    </nav>

    <form
      class="form"
      [formGroup]="mode() === 'login' ? loginForm : signupForm"
      (ngSubmit)="onSubmit()"
      novalidate
    >
      <p class="form-error" *ngIf="errorMessage()" role="alert">
        {{ errorMessage() }}
      </p>

      <div class="field">
        <label class="field__label" for="email">Email</label>
        <input
          id="email"
          class="field__control"
          type="email"
          inputmode="email"
          autocomplete="email"
          placeholder="seu@email.com"
          formControlName="email"
        />
      </div>

      <ng-container *ngIf="mode() === 'signup'">
        <div class="field">
          <label class="field__label" for="nome">Nome</label>
          <input id="nome" class="field__control" type="text" autocomplete="name"
            maxlength="120" formControlName="nome" />
        </div>
        <div class="field">
          <label class="field__label" for="telefone">Telefone</label>
          <input id="telefone" class="field__control" type="tel" autocomplete="tel"
            maxlength="30" formControlName="telefone" />
        </div>
        <div class="field">
          <label class="field__label" for="endereco">Endereço de entrega</label>
          <input id="endereco" class="field__control" type="text" autocomplete="street-address"
            maxlength="500" formControlName="endereco" />
        </div>
        <p class="helper">Cadastro de cliente. Contas da equipe são gerenciadas pela administração.</p>
      </ng-container>

      <div class="field">
        <label class="field__label" for="password">Senha</label>
        <input
          id="password"
          class="field__control"
          type="password"
          [attr.autocomplete]="mode() === 'signup' ? 'new-password' : 'current-password'"
          placeholder="••••••"
          formControlName="password"
        />
      </div>

      <div class="field" *ngIf="mode() === 'signup'">
        <label class="field__label" for="confirmPassword">Confirmar senha</label>
        <input
          id="confirmPassword"
          class="field__control"
          type="password"
          autocomplete="new-password"
          placeholder="••••••"
          formControlName="confirmPassword"
        />
      </div>

      <button class="submit" type="submit" [disabled]="loading()">
        {{ loading() ? (mode() === 'signup' ? 'Cadastrando...' : 'Entrando...') : title() }}
      </button>

      <p class="helper" *ngIf="mode() === 'login'">
        Esqueceu sua senha?
        <a class="helper__link" routerLink="/forgot-password">Recuperar senha</a>
      </p>

      <p class="helper" *ngIf="mode() === 'signup'">
        Ao criar uma conta, você concorda com os
        <a class="helper__link" href="#" (click)="$event.preventDefault()"
          >Termos de Uso</a
        >
      </p>
    </form>
  </section>
</main>
